<svg xmlns="http://www.w3.org/2000/svg" width="796" height="480" viewBox="0 0 796 480" role="img" aria-label="Critical issues, by prevalence">
<style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
<text x="0" y="22" fill="#1f2328" font-size="15" font-weight="600">Critical issues, by prevalence</text>
<text x="0" y="42" fill="#59636e" font-size="12">Share of 281 repositories shipping each exploitable defect</text>
<line x1="320.0" y1="60" x2="320.0" y2="462" stroke="#d1d9e0" stroke-width="1"/>
<text x="320.0" y="54" fill="#59636e" font-size="10" text-anchor="middle">0%</text>
<line x1="453.3" y1="60" x2="453.3" y2="462" stroke="#d1d9e0" stroke-width="1"/>
<text x="453.3" y="54" fill="#59636e" font-size="10" text-anchor="middle">5%</text>
<line x1="586.7" y1="60" x2="586.7" y2="462" stroke="#d1d9e0" stroke-width="1"/>
<text x="586.7" y="54" fill="#59636e" font-size="10" text-anchor="middle">10%</text>
<line x1="720.0" y1="60" x2="720.0" y2="462" stroke="#d1d9e0" stroke-width="1"/>
<text x="720.0" y="54" fill="#59636e" font-size="10" text-anchor="middle">15%</text>
<text x="308" y="91" fill="#1f2328" font-size="12" text-anchor="end">S3  Secret file not covered by .gitignore</text>
<rect x="320" y="74" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="74" width="285.3" height="20" rx="3" fill="#cf222e"/>
<text x="613.3" y="89" fill="#1f2328" font-size="12" font-weight="600">10.7%</text>
<text x="308" y="123" fill="#1f2328" font-size="12" text-anchor="end">S1  Hardcoded provider credential in source</text>
<rect x="320" y="106" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="106" width="274.7" height="20" rx="3" fill="#cf222e"/>
<text x="602.7" y="121" fill="#1f2328" font-size="12" font-weight="600">10.3%</text>
<text x="308" y="155" fill="#1f2328" font-size="12" text-anchor="end">D1  Table created without row level security</text>
<rect x="320" y="138" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="138" width="189.3" height="20" rx="3" fill="#0969da"/>
<text x="517.3" y="153" fill="#1f2328" font-size="12" font-weight="600">7.1%</text>
<text x="308" y="187" fill="#1f2328" font-size="12" text-anchor="end">D8  SQL assembled by string interpolation</text>
<rect x="320" y="170" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="170" width="189.3" height="20" rx="3" fill="#0969da"/>
<text x="517.3" y="185" fill="#1f2328" font-size="12" font-weight="600">7.1%</text>
<text x="308" y="219" fill="#1f2328" font-size="12" text-anchor="end">O1  Secret or personal data written to logs</text>
<rect x="320" y="202" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="202" width="160.0" height="20" rx="3" fill="#0969da"/>
<text x="488.0" y="217" fill="#1f2328" font-size="12" font-weight="600">6.0%</text>
<text x="308" y="251" fill="#1f2328" font-size="12" text-anchor="end">D2  Row level security policy that grants everything</text>
<rect x="320" y="234" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="234" width="152.0" height="20" rx="3" fill="#0969da"/>
<text x="480.0" y="249" fill="#1f2328" font-size="12" font-weight="600">5.7%</text>
<text x="308" y="283" fill="#1f2328" font-size="12" text-anchor="end">D3  Admin/service_role key reachable from client code</text>
<rect x="320" y="266" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="266" width="74.7" height="20" rx="3" fill="#0969da"/>
<text x="402.7" y="281" fill="#1f2328" font-size="12" font-weight="600">2.8%</text>
<text x="308" y="315" fill="#1f2328" font-size="12" text-anchor="end">D4  Storage bucket is public or has no policy</text>
<rect x="320" y="298" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="298" width="66.7" height="20" rx="3" fill="#0969da"/>
<text x="394.7" y="313" fill="#1f2328" font-size="12" font-weight="600">2.5%</text>
<text x="308" y="347" fill="#1f2328" font-size="12" text-anchor="end">S2  Secret exposed through a client-visible env prefix</text>
<rect x="320" y="330" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="330" width="56.0" height="20" rx="3" fill="#0969da"/>
<text x="384.0" y="345" fill="#1f2328" font-size="12" font-weight="600">2.1%</text>
<text x="308" y="379" fill="#1f2328" font-size="12" text-anchor="end">A2  JWT verification disabled, weak, or bypassable</text>
<rect x="320" y="362" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="362" width="48.0" height="20" rx="3" fill="#0969da"/>
<text x="376.0" y="377" fill="#1f2328" font-size="12" font-weight="600">1.8%</text>
<text x="308" y="411" fill="#1f2328" font-size="12" text-anchor="end">A6  Password stored without a modern KDF</text>
<rect x="320" y="394" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="394" width="37.3" height="20" rx="3" fill="#0969da"/>
<text x="365.3" y="409" fill="#1f2328" font-size="12" font-weight="600">1.4%</text>
<text x="308" y="443" fill="#1f2328" font-size="12" text-anchor="end">D9  Firebase security rules allow unrestricted access</text>
<rect x="320" y="426" width="400" height="20" rx="3" fill="#eef1f4"/>
<rect x="320" y="426" width="29.3" height="20" rx="3" fill="#0969da"/>
<text x="357.3" y="441" fill="#1f2328" font-size="12" font-weight="600">1.1%</text>
</svg>
